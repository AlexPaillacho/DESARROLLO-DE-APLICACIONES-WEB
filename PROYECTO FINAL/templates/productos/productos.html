{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary"> Inventario-Logic Servis </h2>
        <a href="{{ url_for('generar_reporte') }}" class="btn btn-danger">
    <i class="fas fa-file-pdf"></i> Descargar PDF
</a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>SKU</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.sku }}</td>
                <td>{{ p.nombre }}</td>
                <td><span class="badge bg-info text-dark">{{ p.categoria }}</span></td>
                <td>{{ p.stock }}</td>
                <td class="text-center">
                    <a href="{{ url_for('producto_editar', sku=p.sku) }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{{ url_for('producto_eliminar', sku=p.sku) }}" 
                       class="btn btn-danger btn-sm" 
                       onclick="return confirm('¿Eliminar {{ p.nombre }}?')">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
