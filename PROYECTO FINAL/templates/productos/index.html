{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Inventario - El Reventador</h2>
        <a href="{{ url_for('generar_reporte') }}" class="btn btn-outline-danger fw-bold shadow-sm">
             Descargar PDF
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded border bg-white">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th class="text-center">SKU</th>
                    <th>Producto</th>
                    <th class="text-center">Stock</th>
                    <th>Categoría</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td class="text-center"><strong>{{ p.sku }}</strong></td>
                    <td>{{ p.producto }}</td>
                    <td class="text-center">
                        <span class="badge {% if p.stock > 10 %}bg-success{% else %}bg-danger{% endif %} rounded-pill">
                            {{ p.stock }}
                        </span>
                    </td>
                    <td>{{ p.categoria }}</td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{{ url_for('producto_editar', sku=p.sku) }}" 
                               class="btn btn-warning btn-sm shadow-sm" title="Editar">
                                ✏️
                            </a>

                            <a href="{{ url_for('producto_eliminar', sku=p.sku) }}" 
                               class="btn btn-danger btn-sm shadow-sm" 
                               onclick="return confirm('¿Eliminar {{ p.producto }}?')" title="Eliminar">
                                🗑️
                            </a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
