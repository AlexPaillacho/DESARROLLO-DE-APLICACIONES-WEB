{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Logic Servis - Login</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-danger p-2">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="admin" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="****" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-sm" style="background-color: #0d47a1; border: none;">
                           Ingresar al Sistema
                         </button>
                    </form>
                </div>
                <div class="card-footer text-muted text-center">
                    <small>"Panel Administrativo | Logic Servis"</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
